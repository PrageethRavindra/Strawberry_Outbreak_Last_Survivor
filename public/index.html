
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Strawberry Outbreak</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <main>
    <section id="menu">
      <h1>🍓 Strawberry Outbreak</h1>
      <h2>Last Survivor</h2>

      <p>
        Survive three dangerous stages.
        You have only one life!
      </p>

      <button id="startBtn">
        Start Survival
      </button>
    </section>

    <section id="gameScreen" hidden>
      <h2>Stage 1 - Infected Forest</h2>

      <canvas
        id="gameCanvas"
        width="800"
        height="480">
      </canvas>

      <p>Move with WASD or Arrow Keys</p>

      <button id="backBtn">
        Back to Menu
      </button>
    </section>
  </main>
  <script src="/js/player.js" defer></script>
  <script src="/js/enemies.js" defer></script>
  <script src="/js/projectiles.js" defer></script>
  <script src="/js/levels.js" defer></script>
  <script src="/js/game.js" defer></script>
  <script src="/js/app.js" defer></script>

</body>
</html>
